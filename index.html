<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>電子發票 - 雙 QR 完整明細解析</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root{
      --bg:#EEEBE0; --paper:#FFFFFF; --ink:#1F1D19; --muted:#8C8776;
      --line:#D8D3C4; --accent:#0B6E4F; --accent-ink:#FFFFFF;
      --accent-soft:#E3EFE9; --danger:#B23A2E; --danger-soft:#F6E7E4;
    }
    body { margin: 0; background: var(--bg); }
    #einv-app{
      font-family:'Noto Sans TC',sans-serif; color:var(--ink); background:var(--bg);
      max-width:480px; margin:0 auto; padding:20px 16px 40px; box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }
    #einv-app *{box-sizing:border-box;}
    .einv-header{margin-bottom:18px;}
    .einv-header h1{font-size:20px;font-weight:700;margin:0 0 4px;}
    .einv-header p{font-size:13px;color:var(--muted);margin:0;line-height:1.6;}
  
    .einv-actions{display:flex;gap:8px;margin-bottom:12px;}
    .einv-btn{
      flex:1; display:flex;align-items:center;justify-content:center;gap:6px;
      padding:12px 10px; border-radius:10px; border:1px solid var(--line);
      background:var(--paper); color:var(--ink); font-size:14px;font-weight:500;
      cursor:pointer; transition:border-color .15s ease, background .15s ease;
    }
    .einv-btn:active{transform:scale(.98);}
    .einv-btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
    .einv-btn.text{border:none;background:none;color:var(--accent);padding:8px 6px;font-size:13px;flex:none;}
    .einv-btn.danger-text{border:none;background:none;color:var(--danger);padding:8px 6px;font-size:13px;flex:none;}
  
    .einv-panel{
      background:var(--paper); border:1px solid var(--line);
      border-radius:12px; padding:14px; margin-bottom:14px;
    }
    .einv-panel h3{font-size:13px;font-weight:500;margin:0 0 10px;color:var(--muted);}
  
    #einv-status{
      font-size:13px; line-height:1.6; padding:10px 12px;
      border-radius:8px; margin-bottom:12px; display:none;
    }
    #einv-status.show{display:block;}
    #einv-status.info{background:var(--accent-soft);color:var(--accent);}
    #einv-status.error{background:var(--danger-soft);color:var(--danger);}
    #einv-status.success{background:#E8F5E9;color:#2E7D32;}
  
    #reader-wrap {
      display: none; position: relative; margin-bottom: 12px;
      border-radius: 12px; overflow: hidden; background: #000;
    }
    #reader-wrap.open { display: block; }
    #reader { width: 100%; border: none; }
    #einv-video-close {
      position: absolute; top: 10px; right: 10px; width: 32px; height: 32px;
      border-radius: 50%; background: rgba(0,0,0,0.6); color: #fff;
      border: none; display: flex; align-items: center; justify-content: center;
      font-size: 16px; cursor: pointer; z-index: 10;
    }
  
    #einv-preview{display:none;}
    #einv-preview.open{display:block;}
    #einv-preview .row{display:flex;justify-content:space-between;padding:5px 0;font-size:13px;border-bottom:1px dashed var(--line);}
    #einv-preview .row:last-child{border-bottom:none;}
    #einv-preview .row .k{color:var(--muted);}
    #einv-preview .row .v{font-family:'IBM Plex Mono',monospace;text-align:right;}
    #einv-preview .amt{font-size:20px;font-weight:600;}
    
    .item-list { margin-top: 10px; border-top: 2px solid var(--line); padding-top: 10px; }
    .item-row { display:flex; justify-content:space-between; font-size:12px; margin-bottom:6px; color:var(--ink); }
    .item-row .name { flex:1; padding-right:8px; }
    .item-row .qty-price { font-family:'IBM Plex Mono',monospace; color:var(--muted); white-space:nowrap; }

    #einv-preview-actions{display:flex;gap:8px;margin-top:12px;}
  
    .einv-summary{
      display:flex;justify-content:space-between;align-items:baseline;
      margin-bottom:10px;padding:0 2px;
    }
    .einv-summary .count{font-size:13px;color:var(--muted);}
    .einv-summary .total{font-size:22px;font-weight:600;}
  
    .einv-toolbar{display:flex;gap:14px;margin-bottom:14px;padding:0 2px;}
  
    #einv-list{display:flex;flex-direction:column;gap:10px;}
    .einv-card{
      background:var(--paper); border:1px solid var(--line);
      border-radius:10px; padding:12px 14px; position:relative;
    }
    .einv-card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
    .einv-card-no{font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600;}
    .einv-card-date{font-size:12px;color:var(--muted);margin-top:2px;}
    .einv-card-amt{font-family:'IBM Plex Mono',monospace;font-size:18px;font-weight:600;text-align:right;}
    
    .card-items { margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); display:none; }
    .card-items.open { display:block; }
    .toggle-items-btn { font-size:12px; color:var(--accent); background:none; border:none; padding:0; cursor:pointer; margin-top:4px; }

    .einv-card-del{
      position:absolute;top:10px;right:10px; width:24px;height:24px;border-radius:6px;
      border:none;background:none;color:var(--muted); font-size:14px;cursor:pointer;
    }
  
    #einv-empty{ text-align:center;padding:36px 16px;color:var(--muted);font-size:13px; border:1px dashed var(--line);border-radius:12px; }
  
    #einv-copy-modal{
      display:none; position:fixed;inset:0; background:rgba(0,0,0,.45);
      align-items:center;justify-content:center; z-index:9999;padding:20px;
    }
    #einv-copy-modal.open{display:flex;}
    .einv-copy-box{
      background:var(--paper);border-radius:12px;padding:16px;
      max-width:440px;width:100%;max-height:70vh;display:flex;flex-direction:column;
    }
    .einv-copy-box textarea{
      flex:1;min-height:200px; font-family:'IBM Plex Mono',monospace;font-size:12px;
      border:1px solid var(--line);border-radius:8px;padding:10px;
      background:var(--bg);color:var(--ink);resize:vertical; margin-top:8px; white-space:pre-wrap;
    }
    #einv-file-input{display:none;}
  </style>
</head>
<body>

<div id="einv-app">
  <div class="einv-header">
    <h1>全幅發票明細掃描</h1>
    <p>請拍下「整張發票」，系統會自動同時讀取左右兩個 QR Code 並合併完整商品明細。</p>
  </div>

  <div id="einv-status"></div>

  <div id="reader-wrap">
    <div id="reader"></div>
    <button id="einv-video-close" aria-label="關閉相機">✕</button>
  </div>

  <div class="einv-actions">
    <!-- 即時掃描維持單邊快速掃描 -->
    <button class="einv-btn primary" id="einv-btn-camera">📷 即時掃描</button>
    <!-- 拍照選圖升級為雙重解析引擎 -->
    <button class="einv-btn" id="einv-btn-photo">🖼 拍整張發票 / 選圖</button>
  </div>

  <div class="einv-panel" id="einv-preview">
    <h3>掃描結果</h3>
    <div id="einv-preview-body"></div>
    <div class="item-list" id="einv-preview-items"></div>
    <div id="einv-preview-actions">
      <button class="einv-btn primary" id="einv-btn-confirm-add">加入清單</button>
      <button class="einv-btn" id="einv-btn-discard">捨棄</button>
    </div>
  </div>

  <input type="file" id="einv-file-input" accept="image/*">

  <div class="einv-summary">
    <div>
      <div class="total"><span>合計</span>NT$ <span id="einv-total">0</span></div>
      <div class="count" id="einv-count">尚未掃描任何發票</div>
    </div>
  </div>

  <div class="einv-toolbar">
    <button class="einv-btn text" id="einv-btn-copy-tsv">匯出 Excel 表格</button>
    <button class="einv-btn text" id="einv-btn-copy-json">匯出 JSON</button>
    <button class="einv-btn danger-text" id="einv-btn-clear">清空全部</button>
  </div>

  <div id="einv-list"></div>
  <div id="einv-empty" style="display:none;">尚未建立發票紀錄。</div>
</div>

<div id="einv-copy-modal">
  <div class="einv-copy-box">
    <h3 id="einv-copy-title">複製資料</h3>
    <textarea id="einv-copy-text" readonly></textarea>
    <div style="display:flex;gap:8px;margin-top:10px;">
      <button class="einv-btn primary" id="einv-btn-do-copy">複製到剪貼簿</button>
      <button class="einv-btn" id="einv-btn-close-copy">關閉</button>
    </div>
  </div>
</div>

<script>
(function(){
  var STORAGE_KEY = 'einvoice-records';
  var invoices = [];
  var pendingRecord = null;
  var html5QrCode = null;

  var els = {
    status: document.getElementById('einv-status'),
    readerWrap: document.getElementById('reader-wrap'),
    fileInput: document.getElementById('einv-file-input'),
    preview: document.getElementById('einv-preview'),
    previewBody: document.getElementById('einv-preview-body'),
    previewItems: document.getElementById('einv-preview-items'),
    list: document.getElementById('einv-list'),
    empty: document.getElementById('einv-empty'),
    total: document.getElementById('einv-total'),
    count: document.getElementById('einv-count'),
    copyModal: document.getElementById('einv-copy-modal'),
    copyTitle: document.getElementById('einv-copy-title'),
    copyText: document.getElementById('einv-copy-text')
  };

  function showStatus(msg, type){
    els.status.textContent = msg; els.status.className = 'show ' + (type || 'info');
  }
  function hideStatus(){ els.status.className = ''; }
  function fmtMoney(n){ return Number(n || 0).toLocaleString('zh-TW'); }

  function loadInvoices(){
    try{ var res = localStorage.getItem(STORAGE_KEY); if(res) invoices = JSON.parse(res); }
    catch(e){ invoices = []; } render();
  }

  function saveInvoices(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(invoices)); }
    catch(e){ showStatus('儲存時發生錯誤。', 'error'); }
  }

  // ==========================================
  // 【核心黑科技】多重 QR 縫合與明細萃取邏輯
  // ==========================================
  function parseMergedQR(qrStrings) {
    // 1. 分辨左右 QR Code
    let leftQR = qrStrings.find(q => /^[A-Za-z]{2}\d{8}/.test(q)) || "";
    let rightQR = qrStrings.find(q => /^\*\*/.test(q)) || "";

    if (!leftQR) {
        throw new Error("無法識別主(左側) QR Code。若是整張發票，請確保相片清晰無反光。");
    }

    // 2. 進行字串縫合 (去除右邊開頭的 **)
    let fullText = leftQR.replace(/\s+/g, '');
    if (rightQR) {
        fullText += rightQR.replace(/\s+/g, '').replace(/^\*\*/, '');
    }

    // 3. 解析標頭檔 (前 77 碼)
    let invoiceNumber = fullText.slice(0, 10);
    let dateStr = fullText.slice(10, 17);
    let dateISO = (parseInt(dateStr.slice(0, 3)) + 1911) + '-' + dateStr.slice(3, 5) + '-' + dateStr.slice(5, 7);
    let randomCode = fullText.slice(17, 21);
    let totalAmount = parseInt(fullText.slice(29, 37), 16);

    // 4. 解析全幅消費明細
    let items = [];
    let tail = fullText.slice(77);
    
    if (tail.startsWith(':')) {
      let parts = tail.split(':');
      
      // 根據台灣發票規格，商品明細固定從 index 5 之後開始，每 3 碼為一組 (品名:數量:單價)
      // 格式：:[編碼]:[總筆數]:[總QR數]:[當前QR]:[品名]:[數量]:[單價]:...
      for(let i = 5; i < parts.length - 2; i += 3) {
        if (parts[i] && parts[i] !== "") {
          items.push({
            name: parts[i], 
            qty: parts[i+1] || "1", 
            price: parts[i+2] || "0"
          });
        }
      }
    }

    return {
      id: 'inv_' + Date.now(),
      invoiceNumber: invoiceNumber, 
      dateISO: dateISO, 
      randomCode: randomCode, 
      totalAmount: totalAmount, 
      items: items,
      hasRightQR: rightQR !== "" // 標記是否成功縫合
    };
  }

  // ==========================================
  // 圖片上傳 (呼叫 Chrome 原生 BarcodeDetector)
  // ==========================================
  els.fileInput.addEventListener('change', async function(e){
    var file = e.target.files && e.target.files[0]; e.target.value = ''; if(!file) return;
    
    hideStatus(); hidePreview(); 
    showStatus('正在啟動多重條碼深度解析引擎...', 'info');

    // 將檔案轉成 Image 物件以供偵測
    const img = new Image();
    const url = URL.createObjectURL(file);
    
    img.onload = async () => {
      try {
        // 檢查瀏覽器是否支援最新的原生 BarcodeDetector
        if ('BarcodeDetector' in window) {
          const detector = new BarcodeDetector({ formats: ['qr_code'] });
          const barcodes = await detector.detect(img);
          
          if (barcodes.length === 0) {
            throw new Error("找不到任何 QR Code，請確認發票平整且光線充足。");
          }

          // 取出所有偵測到的 QR 文字
          const qrStrings = barcodes.map(b => b.rawValue);
          const record = parseMergedQR(qrStrings);
          
          if(record.hasRightQR) {
            showStatus('🎉 成功縫合雙 QR Code！已取得完整明細。', 'success');
          } else {
            showStatus('⚠️ 只掃描到左側 QR Code，明細可能不完整。', 'info');
          }
          
          showPreview(record);

        } else {
          // 如果瀏覽器不支援原生 API (例如舊版或 iOS)，降級使用 html5-qrcode
          showStatus('目前環境不支援多重掃描，將退回單一掃描模式。', 'info');
          if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");
          const decodedText = await html5QrCode.scanFile(file, true);
          const record = parseMergedQR([decodedText]);
          showPreview(record);
        }
      } catch (err) {
        showStatus(err.message || "解析失敗，請確認相片清晰。", 'error');
      } finally {
        URL.revokeObjectURL(url);
      }
    };
    img.onerror = () => showStatus('圖片載入失敗', 'error');
    img.src = url;
  });

  // ---------- 介面渲染 ----------
  function showPreview(record){
    pendingRecord = record;
    var rows = [
      ['發票號碼', record.invoiceNumber, true],
      ['開立日期', record.dateISO],
      ['含稅總計', 'NT$ ' + fmtMoney(record.totalAmount), false, true]
    ];
    
    var html = rows.map(r => `<div class="row"><span class="k">${r[0]}</span><span class="${r[3] ? 'v amt' : 'v'}">${r[1]}</span></div>`).join('');
    els.previewBody.innerHTML = html;

    if(record.items && record.items.length > 0) {
      var itemsHtml = `<div style="font-size:12px; font-weight:600; margin-bottom:6px;">消費明細 (${record.items.length}項)</div>`;
      record.items.forEach(item => {
        itemsHtml += `<div class="item-row"><div class="name">${item.name}</div><div class="qty-price">${item.qty} x ${item.price}</div></div>`;
      });
      els.previewItems.innerHTML = itemsHtml;
      els.previewItems.style.display = 'block';
    } else {
      els.previewItems.style.display = 'none';
    }
    
    els.preview.classList.add('open');
    els.preview.scrollIntoView({behavior:'smooth', block:'nearest'});
  }

  function hidePreview(){ pendingRecord = null; els.preview.classList.remove('open'); }

  function confirmAdd(){
    if(!pendingRecord) return;
    var existingIndex = invoices.findIndex(inv => inv.invoiceNumber === pendingRecord.invoiceNumber);
    if(existingIndex >= 0){
      if(!window.confirm('此發票號碼已存在，是否要覆蓋？')){ hidePreview(); return; }
      invoices[existingIndex] = pendingRecord;
    }else{
      invoices.unshift(pendingRecord);
    }
    hidePreview(); hideStatus(); render(); saveInvoices();
  }

  function render(){
    invoices.sort((a, b) => a.dateISO < b.dateISO ? 1 : (a.dateISO > b.dateISO ? -1 : 0));
    els.total.textContent = fmtMoney(invoices.reduce((sum, inv) => sum + (inv.totalAmount || 0), 0));
    els.count.textContent = invoices.length === 0 ? '尚未掃描任何發票' : ('共 ' + invoices.length + ' 筆');

    if(invoices.length === 0){ els.list.innerHTML = ''; els.empty.style.display = 'block'; return; }
    els.empty.style.display = 'none';

    var html = invoices.map(inv => {
      var itemHtml = '';
      if(inv.items && inv.items.length > 0) {
        itemHtml = `<button class="toggle-items-btn" onclick="this.nextElementSibling.classList.toggle('open')">查看完整明細 (${inv.items.length}) ▼</button>` + 
                   `<div class="card-items">` + 
                   inv.items.map(item => `<div class="item-row"><div class="name">${item.name}</div><div class="qty-price">${item.qty} x ${item.price}</div></div>`).join('') +
                   `</div>`;
      }
      
      return `<div class="einv-card" data-id="${inv.id}">
        <button class="einv-card-del" data-del="${inv.id}">✕</button>
        <div class="einv-card-top">
          <div><div class="einv-card-no">${inv.invoiceNumber}</div><div class="einv-card-date">${inv.dateISO}</div></div>
          <div class="einv-card-amt">NT$ ${fmtMoney(inv.totalAmount)}</div>
        </div>
        ${itemHtml}
      </div>`;
    }).join('');
    els.list.innerHTML = html;
  }

  els.list.addEventListener('click', function(e){
    var btn = e.target.closest('[data-del]');
    if(!btn) return;
    var idx = invoices.findIndex(inv => inv.id === btn.getAttribute('data-del'));
    if(idx >= 0 && window.confirm('確定要刪除此筆紀錄嗎？')){ invoices.splice(idx, 1); render(); saveInvoices(); }
  });

  // ---------- 單邊即時掃描模組 (備用) ----------
  function initScanner() { if (!html5QrCode) html5QrCode = new Html5Qrcode("reader"); }
  function startCamera(){
    hidePreview(); hideStatus(); initScanner();
    if (html5QrCode.isScanning) return;

    els.readerWrap.classList.add('open');
    html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 250, height: 250 } },
      function(decodedText) { 
        try {
          const record = parseMergedQR([decodedText]);
          stopCamera(); showPreview(record);
        } catch(e) {}
      },
      function(errorMessage) {}
    ).catch(err => {
      els.readerWrap.classList.remove('open');
      showStatus('相機啟動失敗，請確認已授權使用相機，且網頁已透過 HTTPS 開啟。', 'error');
    });
  }
  function stopCamera(){
    if(html5QrCode && html5QrCode.isScanning){
      html5QrCode.stop().then(() => els.readerWrap.classList.remove('open')).catch(e => els.readerWrap.classList.remove('open'));
    } else { els.readerWrap.classList.remove('open'); }
  }

  // ---------- 匯出模組 ----------
  function openCopyModal(title, text){
    els.copyTitle.textContent = title; els.copyText.value = text;
    els.copyModal.classList.add('open'); els.copyText.select();
  }
  document.getElementById('einv-btn-copy-tsv').addEventListener('click', () => {
    if(invoices.length === 0) return showStatus('清單目前是空的。', 'error');
    var header = ['發票號碼', '開立日期', '總金額', '品名', '數量', '單價'].join('\t');
    var rows = [];
    invoices.forEach(inv => {
      if(inv.items && inv.items.length > 0) {
        inv.items.forEach(item => {
          rows.push([inv.invoiceNumber, inv.dateISO, inv.totalAmount, item.name, item.qty, item.price].join('\t'));
        });
      } else { rows.push([inv.invoiceNumber, inv.dateISO, inv.totalAmount, '無明細資料', '', ''].join('\t')); }
    });
    openCopyModal('貼上至 Excel 的文字', [header].concat(rows).join('\n'));
  });
  document.getElementById('einv-btn-copy-json').addEventListener('click', () => {
    if(invoices.length === 0) return showStatus('清單目前是空的。', 'error');
    openCopyModal('JSON 資料', JSON.stringify(invoices, null, 2));
  });
  
  // ---------- 事件綁定 ----------
  document.getElementById('einv-btn-camera').addEventListener('click', startCamera);
  document.getElementById('einv-video-close').addEventListener('click', stopCamera);
  document.getElementById('einv-btn-photo').addEventListener('click', () => els.fileInput.click());
  document.getElementById('einv-btn-confirm-add').addEventListener('click', confirmAdd);
  document.getElementById('einv-btn-discard').addEventListener('click', hidePreview);
  document.getElementById('einv-btn-close-copy').addEventListener('click', () => els.copyModal.classList.remove('open'));
  document.getElementById('einv-btn-clear').addEventListener('click', () => { if(window.confirm('確定清空？')){ invoices = []; render(); saveInvoices(); }});
  document.getElementById('einv-btn-do-copy').addEventListener('click', async () => {
    await navigator.clipboard.writeText(els.copyText.value);
    document.getElementById('einv-btn-do-copy').textContent = '已複製';
    setTimeout(() => document.getElementById('einv-btn-do-copy').textContent = '複製到剪貼簿', 1000);
  });

  loadInvoices();
})();
</script>
</body>
</html>
